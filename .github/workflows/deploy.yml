name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v4

      # 2. Set up Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 16.x

      # 3. Build the project
      - name: Build site
        run: |
          cd v0.2.0
          npm install
          npm run build

      # 4. Verify the build folder exists
      - name: Verify build folder
        run: ls -R v0.2.0/dist

      # 5. Upload the artifact with the correct name
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: v0.2.0/dist
          name: github-pages   # must match what deploy-pages expects

      # 6. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
